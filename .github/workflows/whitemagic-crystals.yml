name: Pinned WhiteMagic crystal adapter
on:
  push:
    branches: [main, feat/whitemagic-crystals-row]
  pull_request:
    paths:
      - agmi/adapters/whitemagic_crystals.py
      - agmi/check.py
      - agmi/attacks/**
      - tests/test_whitemagic_crystals.py
      - .github/workflows/whitemagic-crystals.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    env:
      AGMI_WHITEMAGIC_CRYSTAL_CLIENT: ${{ github.workspace }}/.pinned/crystal_client.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify exact source bytes
        run: |
          mkdir -p .pinned
          curl --fail --location --retry 2 --output "$AGMI_WHITEMAGIC_CRYSTAL_CLIENT" \
            https://raw.githubusercontent.com/lbailey94/whitemagic/0fe89e35abce9fcd2d918d79a54f8763bf1acdea/scripts/crystal_client.py
          printf '%s  %s\n' ddf740898d4282ac68451cece42373c34ef03a17a610d44b8886b0c558b01b1c "$AGMI_WHITEMAGIC_CRYSTAL_CLIENT" | sha256sum --check
      - run: python -m pip install -e . pytest cryptography
      - name: Require the selected client and execute the dedicated row tests
        run: |
          test -s "$AGMI_WHITEMAGIC_CRYSTAL_CLIENT"
          python -m pytest -q tests/test_whitemagic_crystals.py
